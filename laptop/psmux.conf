# psmux config for AI CLI sessions + MustardOS console (installed as ~\.psmux.conf by install.ps1)
set -g default-shell pwsh
# window size follows the device that was used last (laptop or console)
set -g window-size latest
set -g mouse on
set -g history-limit 20000
# fast Esc (Claude Code: interrupt / rewind)
set -g escape-time 10
set -g status-position bottom
set -g status-left "[#S] "
set -g status-left-length 40         # full session name, e.g. claude-todo-ip9-pl
set -g status-right " Ctrl+b d = detach | %H:%M"   # detach hint for the console
set -g status-right-length 40
# lets Claude Code detect window focus
set -g focus-events on
