# psmux config for AI CLI sessions + MustardOS console (installed as ~\.psmux.conf by install.ps1)
set -g default-shell pwsh
# window size = the smallest attached client: while the console is attached, text is wrapped for its
# 91x30 screen (the laptop window shows the same area); with only the laptop attached it gets the full size.
# ("latest" switched back to the laptop size on any laptop focus/mouse event and cut lines on the console)
set -g window-size smallest
set -g mouse on
set -g history-limit 20000
# fast Esc (Claude Code: interrupt / rewind)
set -g escape-time 10
set -g status-position bottom
set -g status-left "[#S] "
set -g status-left-length 40         # full session name, e.g. claude-todo-ip9-pl
set -g status-right " F12 = detach | %H:%M"   # detach hint for the console
set -g status-right-length 40
# lets Claude Code detect window focus
set -g focus-events on
# one-key detach: the console terminal (muxterm) does not pass Ctrl+b from a Bluetooth keyboard
bind-key -n F12 detach-client
